<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hotel</title>

<style>
*{margin:0;padding:0;font-family:Arial}
header{background:#8B0000;color:#fff;padding:15px;text-align:center}
nav{background:#111;padding:10px;text-align:center}
nav a{color:white;margin:10px;text-decoration:none}

.hero{
background:url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5") center/cover;
height:80vh;color:white;
display:flex;flex-direction:column;
justify-content:center;align-items:center;text-align:center
}
.btn{background:orange;padding:12px 25px;color:black;text-decoration:none;border-radius:5px}

.menu{padding:40px;text-align:center}
.card{background:#f4f4f4;margin:15px;padding:15px;border-radius:10px}

form{background:#eee;padding:20px;margin:20px}
input,textarea{width:100%;padding:10px;margin:10px 0}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;
border-radius:50%;font-size:22px;text-decoration:none
}
</style>
</head>

<body>

<header>
<h1>My Hotel</h1>
<p>Tasty Food • Fast Delivery</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#menu">Menu</a>
<a href="#order">Order</a>
</nav>

<section class="hero">
<h2>Delicious Food Delivered</h2>
<p>Order on WhatsApp or Cash on Delivery</p>
<a class="btn" href="#order">Order Now</a>
</section>

<section id="menu" class="menu">
<h2>Our Special Menu</h2>

<div class="card">
<h3>Chicken Biryani</h3>
<p>₹180</p>
</div>

<div class="card">
<h3>Veg Meals</h3>
<p>₹120</p>
</div>

<div class="card">
<h3>Fried Rice</h3>
<p>₹150</p>
</div>
</section>

<section id="order">
<h2 style="text-align:center">COD Order Form</h2>

<form action="https://formsubmit.co/YOUR-EMAIL@gmail.com" method="POST">
<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="phone" placeholder="Phone Number" required>
<textarea name="address" placeholder="Delivery Address"></textarea>
<input type="text" name="order" placeholder="Your Order">
<button type="submit">Place COD Order</button>
</form>
</section>

<!-- WhatsApp Button -->
<a class="whatsapp" href="https://wa.me/91XXXXXXXXXX?text=I%20want%20to%20order">💬</a>

</body>
</html>
